# XcodeGen spec. The .xcodeproj is generated in CI with `xcodegen generate`
# and is never committed.
#
name: PhotoSel

options:
  bundleIdPrefix: com.garoth93
  deploymentTarget:
    iOS: "26.0"   # iPad dell'utente: iPadOS 26; SDK del runner: iOS 26.5 (Xcode 26.6)
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  PhotoSelCore:
    path: ../../packages/PhotoSelCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "2"          # iPad only
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is intentionally empty: CI builds pass CODE_SIGNING_ALLOWED=NO,
    # the unsigned .ipa is signed later with Sideloadly/SideStore.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  PhotoSel:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: PhotoSelCore
        product: PhotoSelCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garoth93.photosel
        PRODUCT_NAME: PhotoSel
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist   # generated by XcodeGen from the properties below (git-ignored)
      properties:
        CFBundleDisplayName: photoSel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryAddUsageDescription: "photoSel salva nella libreria Foto le foto che esporti, solo se lo chiedi tu."
        ITSAppUsesNonExemptEncryption: false

schemes:
  PhotoSel:
    build:
      targets:
        PhotoSel: all
    run:
      config: Debug
    archive:
      config: Release
